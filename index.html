<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ごはん要否チェック</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #0066cc;
      --danger: #d9534f;
      --success: #28a745;
      --text: #222222;
      --border: #cccccc;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px;
      font-size: 18px; /* 全体的に文字を大きく設定 */
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 26px; /* タイトル拡大 */
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .member-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }

    .member-name {
      font-size: 22px; /* メンバー名拡大 */
      font-weight: bold;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 4px;
    }

    .options {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px 8px;
      font-size: 18px; /* ボタン文字拡大 */
      font-weight: bold;
      border: 2px solid var(--border);
      border-radius: 8px;
      background-color: #f8f9fa;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn.active-eat {
      background-color: var(--success);
      color: white;
      border-color: var(--success);
    }

    .btn.active-no-eat {
      background-color: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .reset-container {
      text-align: center;
      margin-top: 24px;
    }

    .reset-btn {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🍚 ごはん要否チェック</h1>
  <div id="members-list"></div>

  <div class="reset-container">
    <button class="reset-btn" onclick="resetAll()">選択をクリア</button>
  </div>
</div>

<script>
  // 初期メンバーの設定
  const initialMembers = ["ちち", "はは", "はる", "ゆい", "りな"];

  // 状態の読み込み（ローカルストレージ）
  function loadState() {
    const saved = localStorage.getItem('gohan_status');
    if (saved) {
      return JSON.parse(saved);
    }
    const state = {};
    initialMembers.forEach(m => state[m] = null);
    return state;
  }

  let state = loadState();

  // 画面の描画
  function render() {
    const listEl = document.getElementById('members-list');
    listEl.innerHTML = '';

    initialMembers.forEach(member => {
      const card = document.createElement('div');
      card.className = 'member-card';

      const nameEl = document.createElement('div');
      nameEl.className = 'member-name';
      nameEl.textContent = member;

      const optionsEl = document.createElement('div');
      optionsEl.className = 'options';

      const eatBtn = document.createElement('button');
      eatBtn.className = `btn ${state[member] === 'eat' ? 'active-eat' : ''}`;
      eatBtn.textContent = '食べる ⭕';
      eatBtn.onclick = () => setStatus(member, 'eat');

      const noEatBtn = document.createElement('button');
      noEatBtn.className = `btn ${state[member] === 'no-eat' ? 'active-no-eat' : ''}`;
      noEatBtn.textContent = 'いらない ❌';
      noEatBtn.onclick = () => setStatus(member, 'no-eat');

      optionsEl.appendChild(eatBtn);
      optionsEl.appendChild(noEatBtn);

      card.appendChild(nameEl);
      card.appendChild(optionsEl);

      listEl.appendChild(card);
    });
  }

  // ステータスの更新と保存
  function setStatus(member, status) {
    if (state[member] === status) {
      state[member] = null; // 同じボタンを押したら解除
    } else {
      state[member] = status;
    }
    localStorage.setItem('gohan_status', JSON.stringify(state));
    render();
  }

  // クリア機能
  function resetAll() {
    initialMembers.forEach(m => state[m] = null);
    localStorage.setItem('gohan_status', JSON.stringify(state));
    render();
  }

  // 初期実行
  render();
</script>

</body>
</html>
